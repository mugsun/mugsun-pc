name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Checkout analytics SDK (mugsun-track)
        run: git clone --depth 1 https://github.com/mugsun/mugsun-track.git ../mugsun-track

      # 版本取自 package.json 的 packageManager（pnpm@11.9.0，与 mugsun-track 一致）
      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Build analytics SDK
        run: pnpm --dir ../mugsun-track install --frozen-lockfile && pnpm --dir ../mugsun-track build

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # 先跑 vite（unplugin-auto-import / components）生成 src/types/import/*.d.ts，
      # 这两个文件不入库；vue-tsc 与 ESLint 都依赖它们，必须在其之前生成
      - name: Generate auto-imports.d.ts (vite build)
        run: pnpm exec vite build

      - name: Verify generated declarations
        run: test -s src/types/import/auto-imports.d.ts && test -s src/types/import/components.d.ts

      - name: Typecheck (vue-tsc)
        run: pnpm run typecheck

      - name: Lint
        run: pnpm run lint
