name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}${{ github.ref == 'refs/heads/main' && format('-{0}', github.sha) || '' }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      # 版本取自 package.json 的 packageManager（pnpm@11.28.2）
      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # 先跑 vite（unplugin-auto-import / components）生成 src/types/import/*.d.ts，
      # 这两个文件不入库；vue-tsc 与 ESLint 都依赖它们，必须在其之前生成
      - name: Generate auto-imports.d.ts (vite build)
        run: pnpm exec vite build

      - name: Verify generated declarations
        run: test -s src/types/import/auto-imports.d.ts && test -s src/types/import/components.d.ts

      - name: Typecheck (vue-tsc)
        run: pnpm run typecheck

      - name: Lint
        run: pnpm run lint

      # 单测（vitest，jsdom）：tests/unit/**/*.test.ts
      - name: Unit tests (vitest)
        run: pnpm test

  ui-check:
    name: UI self-check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      # 版本取自 package.json 的 packageManager（pnpm@11.28.2）
      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      # 中文字形与本地一致，否则中文 label/提示用回退字体，宽度不同会影响溢出判断
      - name: Install CJK fonts
        run: sudo apt-get update -q && sudo apt-get install -y -q fonts-noto-cjk

      # 空提交所有新增/编辑弹窗与表单页，中/英 × 亮/暗 四组合断言校验提示与标签完整可见
      - name: UI self-check (form layout + standalone apps)
        run: pnpm test:ui-check

      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ui-check-report
          path: e2e-ui-report/
          retention-days: 7

  # CSP 强制模式 e2e（#63）：构建 pc/boot 镜像，enforce + 关验证码，跑 e2e-csp，上传 result.json
  csp-e2e:
    name: csp-e2e
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout mugsun-pc
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: mugsun-pc
          persist-credentials: false

      - name: Checkout mugsun-boot
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: mugsun/mugsun-boot
          # 钉在 #70 JetCache 系列之前：81dbe7f 在 csp 栈触发 JetCacheCondition SIOOB
          ref: 6d736c5460d29596f25ea5d650eb26fc07a6810c
          path: mugsun-boot
          persist-credentials: false

      - name: Checkout mugsun-core
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: mugsun/mugsun-core
          ref: 50c5843684c2f297f6aa37193fcc4e0c48ff12c6
          path: mugsun-core
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          package_json_file: mugsun-pc/package.json

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: mugsun-pc/.nvmrc
          cache: pnpm
          cache-dependency-path: mugsun-pc/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: mugsun-pc
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        working-directory: mugsun-pc
        run: pnpm exec playwright install --with-deps chromium

      - name: Install CJK fonts
        run: sudo apt-get update -q && sudo apt-get install -y -q fonts-noto-cjk

      - name: CSP enforce e2e (compose + playwright)
        working-directory: mugsun-pc
        env:
          # 留给后续 dump / artifact；job 末尾再 down -v
          KEEP: '1'
        run: scripts/ci/run-csp-e2e.sh

      - name: Dump compose logs on failure
        if: failure()
        working-directory: mugsun-pc
        run: |
          mkdir -p test-results/csp
          docker compose -p mugsun-csp-e2e \
            -f docker/compose.pc.yml -f docker/compose.csp-e2e.yml \
            --env-file docker/.env.csp-e2e logs --tail 200 \
            > test-results/csp/compose-logs.txt 2>&1 || true

      - name: Upload CSP e2e artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: csp-e2e-result
          path: |
            mugsun-pc/test-results/csp/
          if-no-files-found: warn
          retention-days: 14

      - name: Tear down CSP stack
        if: always()
        working-directory: mugsun-pc
        run: |
          docker compose -p mugsun-csp-e2e \
            -f docker/compose.pc.yml -f docker/compose.csp-e2e.yml \
            --env-file docker/.env.csp-e2e down -v --remove-orphans || true
